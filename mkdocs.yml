site_name: VOXPrint AI Clarity
site_description: Lightweight non-generative video restoration.
site_url: https://mitroshenkov87.github.io/voxprint-clarity/
repo_url: https://github.com/Mitroshenkov87/voxprint-clarity
repo_name: Mitroshenkov87/voxprint-clarity
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_bases: false
            members_order: source
            heading_level: 2
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - User guide: USER-GUIDE.md
  - Install: INSTALL.md
  - Command line: CLI.md
  - Command reference: reference/cli.md
  - Architecture: ARCHITECTURE.md
  - Changelog: CHANGELOG.md
  - Project file: formats/VXCLARITY.md
  - Engine: ENGINE-INTERFACE.md
  - API reference: reference/api.md
  - Roadmap: roadmap.md
  - Benchmark: BENCHMARK.md
  - GPU testing: TESTING-GPU.md
  - Decisions: DECISIONS.md
  - Research: RESEARCH.md
  - Codenames: RELEASES-CODENAMES.md

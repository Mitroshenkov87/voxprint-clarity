# Tag-triggered pre-release. Push a tag that starts with v plus the version
# in BUILD.json (the published candidate is v1.0.0-rc.999) after this
# workflow is on the default branch.
# The Windows asset is the full online installer. /RUNTIME=skip is only the
# smoke test. The Linux tarball is experimental.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 ffmpeg
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install the shared engine
        shell: bash
        run: |
          python -m pip install "voxprint-engine @ git+https://github.com/Mitroshenkov87/voxprint-enlarge@d11d60921448b697d832b2699e6e3e04c62c6dfd"
          python -c "import voxprint_engine"
      - name: Check the release tag
        shell: bash
        run: |
          python -c "import json,os,re,pathlib; tag=os.environ['GITHUB_REF_NAME']; version=json.loads(pathlib.Path('BUILD.json').read_text(encoding='utf-8'))['version']; assert re.fullmatch(r'v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?', tag), tag; assert tag.startswith('v'+version), (tag, version); print('release tag:', tag, 'version', version)"
      - name: Lint
        run: |
          ruff check clarity main.py tests
          mypy
      - name: Codename is unique in the suite registry
        run: python -m clarity.codenames
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          CLARITY_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m pytest
      - name: Window self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m clarity --selftest

  installer:
    name: Windows online installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the build stamp
        shell: pwsh
        run: |
          $meta = Get-Content -Raw -Path BUILD.json | ConvertFrom-Json
          $build = [int]$meta.build
          $codename = [string]$meta.codename
          $version = [string]$meta.version
          if (-not $codename) { throw "BUILD.json codename is empty" }
          $info = [ordered]@{
            commit = "${{ github.sha }}".Substring(0, 7)
            built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            run = "${{ github.run_number }}"
            ref = "${{ github.ref_name }}"
            version = $version
            build = $build
            codename = $codename
            flavour = "online installer"
          }
          [IO.File]::WriteAllText("$PWD\build_info.json", ($info | ConvertTo-Json), (New-Object Text.UTF8Encoding $false))
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc installer\VoxprintClarity.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: Silent install without the GPU runtime
        shell: pwsh
        run: |
          $setup = (Resolve-Path installer\Output\VoxprintClarity-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\clarity","/RUNTIME=skip" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed ($($p.ExitCode))" }
          foreach ($f in @("C:\clarity\main.py","C:\clarity\LICENSE","C:\clarity\branding\clarity.ico","C:\clarity\clarity\__main__.py")) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Voxprint" -Filter "*.lnk"
          if (-not ($menu | Where-Object { $_.Name -eq "Voxprint AI Clarity.lnk" })) { throw "Start menu shortcut missing from the Voxprint folder" }
          Start-Process "C:\clarity\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path C:\clarity); $i++) { Start-Sleep 2 }
          if (Test-Path C:\clarity) { throw "uninstall left C:\clarity" }
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/VoxprintClarity-Setup.exe
          if-no-files-found: error

  linux-package:
    name: Linux package (experimental)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the tarball and try an AppImage
        run: bash installer/linux/build-package.sh
      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish the pre-release
    needs: [installer, linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title=$(python -c 'from clarity.appinfo import release_title; print(release_title())')
          cd release-assets
          rm -f SHA256SUMS
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | while read -r name; do
            sha256sum "$name"
          done > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS
          notes="Pre-release. The codename is a Hebrew word from the Torah or Tanakh, read from BUILD.json. The Windows file is the full online installer: setup downloads Python 3.14, the CUDA 13.0 PyTorch wheel, the restore libraries, and the public engine. It is not code-signed. The Linux tarball is experimental. Built from commit ${GITHUB_SHA}."
          printf '%s\n\nInstall and first-run notes: docs/USER-GUIDE.md\n' "$notes" > ../release-notes.md
          mapfile -t files < <(find . -type f -printf '%P\n' | sort)
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "$title" \
            --verify-tag \
            --notes-file ../release-notes.md \
            "${files[@]}"

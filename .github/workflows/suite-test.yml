# Shared by CI and the release workflow. Change the selftest here, not in
# the callers, so a tag build cannot drift from the pull-request job.
name: Suite test
on:
  workflow_call:
    inputs:
      check_release_tag:
        description: Assert GITHUB_REF_NAME matches the version in BUILD.json
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 ffmpeg
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install the shared engine
        shell: bash
        run: |
          python -m pip install "voxprint-engine @ git+https://github.com/Mitroshenkov87/voxprint-enlarge@9183489"
          python -c "import voxprint_engine"
      - name: Check the release tag
        if: inputs.check_release_tag
        shell: bash
        run: |
          python -c "import json,os,re,pathlib; tag=os.environ['GITHUB_REF_NAME']; version=json.loads(pathlib.Path('BUILD.json').read_text(encoding='utf-8'))['version']; assert re.fullmatch(r'v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?', tag), tag; assert tag.startswith('v'+version), (tag, version); print('release tag:', tag, 'version', version)"
      - name: Lint
        run: |
          ruff check clarity main.py tests scripts
          mypy
      - name: Codename is unique in the suite registry
        run: python -m clarity.codenames
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          CLARITY_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m pytest
      - name: Window self-test
        env:
          QT_QPA_PLATFORM: offscreen
          VOXPRINT_HOME: ${{ runner.temp }}/voxprint-suite
        run: python -m clarity --selftest --no-gpu
